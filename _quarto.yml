project:
  type: website
  output-dir: docs
  pre-render: python3 scripts/build_news.py
  render:
    - "*.qmd"
    - "blog/**/*.qmd"
    - "news/**/*.qmd"
    - "people/**/*.qmd"
  resources:
    - assets/
    - data/
    - images/web/
    - llms.txt

website:
  title: "The Fox Lab"
  site-url: "https://sjfox.github.io/foxlabwebsite"
  description: "Outbreak forecasting and infectious disease modeling at Northern Arizona University."
  image: https://sjfox.github.io/foxlabwebsite/images/web/home/grand-canyon.jpeg
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  favicon: images/web/branding/fox-mark.svg
  search:
    location: navbar
    type: overlay
    copy-button: true
  navbar:
    logo: images/web/branding/fox-mark.svg
    logo-alt: "The Fox Lab home"
    left:
      - text: "Research"
        href: research.qmd
      - text: "People"
        href: people.qmd
      - text: "Lab Culture"
        href: culture.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Lab News"
        href: news/index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Opportunities"
        href: opportunities.qmd
      - text: "Contact"
        href: contact.qmd
    right:
      - text: "Bluesky"
        href: https://bsky.app/profile/foxandtheflu.bsky.app
  page-footer:
    left: "The Fox Lab · Northern Arizona University · Flagstaff, Arizona"
    right: "Built with Quarto."

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header: assets/structured-data.html
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
